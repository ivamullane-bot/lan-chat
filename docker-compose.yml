version: '3'

services:
  lan-chat:
    container_name: lan-chat
    restart: always
    network_mode: host
    build: https://github.com/ivamullane-bot/lan-chat.git
    volumes:
      - /vol1/1000/docker/lan-chat/data:/app/data
    environment:
      - LAN_CHAT_ADMIN=admin
      - LAN_CHAT_ADMIN_PASSWORD=admin123
