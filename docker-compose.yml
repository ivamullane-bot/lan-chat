services:
  lan-chat:
    build: https://github.com/ivamullane-bot/lan-chat.git
    container_name: lan-chat
    ports:
      - "3333:3333"
    volumes:
      - ./lan-chat-data:/app/data
    environment:
      - LAN_CHAT_ADMIN=admin
      - LAN_CHAT_ADMIN_PASSWORD=admin123
      - SECRET_KEY=change-this-to-a-random-string
    restart: unless-stopped
